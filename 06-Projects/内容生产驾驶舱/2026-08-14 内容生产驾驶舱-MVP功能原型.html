<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容生产驾驶舱｜MVP 功能原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #16181c;
      --nav: #1b1e23;
      --surface: #20242a;
      --surface-2: #262b32;
      --surface-3: #2d333c;
      --line: #383f49;
      --line-strong: #505966;
      --text: #eef1f4;
      --muted: #a9b0ba;
      --faint: #737c88;
      --accent: #5aa6a8;
      --accent-strong: #7bc4c4;
      --accent-soft: rgba(90,166,168,.13);
      --human: #d7a84f;
      --human-soft: rgba(215,168,79,.13);
      --success: #67b987;
      --success-soft: rgba(103,185,135,.13);
      --danger: #dc7171;
      --danger-soft: rgba(220,113,113,.12);
      --info: #76a7e8;
      --info-soft: rgba(118,167,232,.13);
      --radius-sm: 4px;
      --radius-md: 7px;
      --radius-lg: 10px;
      --shadow: 0 18px 48px rgba(0,0,0,.27);
      --font-ui: "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      --font-data: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.52;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent-strong);
      outline-offset: 2px;
    }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      grid-template-rows: 48px minmax(0, 1fr);
      grid-template-areas: "top top" "nav main";
    }

    .topbar {
      grid-area: top;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: #181b20;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .brand { display:flex; align-items:center; gap:9px; min-width: 220px; font-weight: 680; letter-spacing: .02em; }
    .brand-mark { width: 22px; height: 22px; border: 1px solid var(--accent); display:grid; place-items:center; border-radius:5px; color:var(--accent-strong); font: 700 11px var(--font-data); }
    .vault-status { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--success); box-shadow:0 0 0 3px var(--success-soft); }
    .top-spacer { flex:1; }
    .state-lab { display:flex; align-items:center; gap:7px; }
    .state-lab label { color:var(--muted); font-size:12px; }
    select, .input, textarea {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 7px 9px;
    }
    .topbar select { padding:5px 28px 5px 8px; font-size:12px; }

    .sidebar {
      grid-area: nav;
      border-right: 1px solid var(--line);
      background: var(--nav);
      padding: 12px 9px 18px;
      overflow-y: auto;
    }
    .nav-group { margin: 8px 0 14px; }
    .nav-title { color:var(--faint); font:600 10px/1.4 var(--font-data); letter-spacing:.12em; padding: 5px 9px; text-transform:uppercase; }
    .nav-item {
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      border:1px solid transparent;
      border-radius:var(--radius-sm);
      background:transparent;
      padding:8px 9px;
      text-align:left;
      cursor:pointer;
      color:#c9cfd6;
      min-height:36px;
    }
    .nav-item:hover { background:var(--surface); }
    .nav-item.active { color:#fff; background:var(--accent-soft); border-color:rgba(90,166,168,.36); }
    .nav-key { color:var(--faint); font: 10px var(--font-data); }
    .nav-count { min-width:20px; padding:1px 6px; border-radius:10px; background:var(--surface-3); color:var(--muted); font:11px var(--font-data); text-align:center; }
    .sidebar-note { margin:18px 7px 0; border-top:1px solid var(--line); padding-top:12px; color:var(--faint); font-size:11px; }

    main { grid-area: main; min-width: 0; overflow: auto; }
    .workspace { max-width: 1500px; margin: 0 auto; padding: 20px 24px 88px; }
    .page-header { display:flex; align-items:flex-start; gap:16px; margin-bottom:18px; }
    .page-heading { min-width:0; }
    .breadcrumb { color:var(--faint); font:11px var(--font-data); margin-bottom:5px; }
    h1 { margin:0; font-size:23px; line-height:1.25; letter-spacing:-.01em; }
    .page-subtitle { color:var(--muted); margin-top:5px; max-width:760px; }
    .page-actions { margin-left:auto; display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }

    .btn {
      border:1px solid var(--line-strong);
      border-radius:var(--radius-sm);
      background:var(--surface-2);
      min-height:34px;
      padding:6px 11px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      white-space:nowrap;
    }
    .btn:hover { border-color:#6b7684; background:var(--surface-3); }
    .btn.primary { background:var(--accent); color:#08191a; border-color:var(--accent); font-weight:700; }
    .btn.primary:hover { background:var(--accent-strong); }
    .btn.human { background:var(--human); color:#211603; border-color:var(--human); font-weight:700; }
    .btn.ghost { background:transparent; }
    .btn.danger { border-color:rgba(220,113,113,.52); color:#f1a5a5; background:var(--danger-soft); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn.small { min-height:29px; padding:4px 8px; font-size:12px; }

    .badge { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line-strong); border-radius:10px; padding:2px 7px; color:var(--muted); font-size:11px; line-height:1.4; white-space:nowrap; }
    .badge.ai { color:var(--accent-strong); border-color:rgba(90,166,168,.48); background:var(--accent-soft); font-family:var(--font-data); }
    .badge.human { color:#e9c779; border-color:rgba(215,168,79,.48); background:var(--human-soft); font-family:var(--font-data); }
    .badge.success { color:#8ed2a7; border-color:rgba(103,185,135,.44); background:var(--success-soft); }
    .badge.danger { color:#efa0a0; border-color:rgba(220,113,113,.44); background:var(--danger-soft); }
    .badge.info { color:#9abfed; border-color:rgba(118,167,232,.44); background:var(--info-soft); }
    .badge.neutral { color:#c2c8cf; }
    .mono { font-family:var(--font-data); font-size:.92em; }
    .muted { color:var(--muted); }
    .faint { color:var(--faint); }
    .strong { font-weight:680; }

    .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); min-width:0; }
    .panel-head { display:flex; align-items:center; gap:10px; min-height:46px; padding:10px 13px; border-bottom:1px solid var(--line); }
    .panel-title { font-weight:680; }
    .panel-sub { color:var(--muted); font-size:12px; }
    .panel-head .spacer { flex:1; }
    .panel-body { padding:14px; }
    .rule { height:1px; background:var(--line); margin:13px 0; }
    .grid-2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,.72fr); gap:14px; }
    .grid-equal { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .stack { display:grid; gap:12px; }
    .row { display:flex; align-items:center; gap:9px; }
    .row.wrap { flex-wrap:wrap; }
    .row .spacer { flex:1; }

    .metric-strip { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; margin-bottom:14px; }
    .metric { padding:11px 13px; background:var(--surface); border-right:1px solid var(--line); }
    .metric:last-child { border:0; }
    .metric-label { color:var(--muted); font-size:12px; }
    .metric-value { display:flex; align-items:baseline; gap:6px; margin-top:2px; font:700 21px/1.25 var(--font-data); }
    .metric-note { font:11px var(--font-ui); color:var(--faint); }

    .next-action { border:1px solid rgba(215,168,79,.48); background:var(--human-soft); border-radius:var(--radius-md); padding:13px; }
    .next-action .eyebrow { color:#e7c476; font:700 10px var(--font-data); letter-spacing:.1em; }
    .next-action h2 { font-size:17px; margin:5px 0 3px; }
    .next-action p { color:#c7cbd0; margin:0 0 11px; }
    .reason { margin-top:8px; color:var(--muted); font-size:12px; }

    .list { display:grid; }
    .list-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:11px; padding:11px 13px; border-bottom:1px solid var(--line); }
    .list-row:last-child { border-bottom:0; }
    .list-row.selectable { cursor:pointer; }
    .list-row.selectable:hover { background:rgba(255,255,255,.025); }
    .list-row.selected { background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
    .list-title { font-weight:640; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .list-meta { color:var(--muted); font-size:12px; margin-top:3px; }
    .check-box { width:17px; height:17px; border:1px solid var(--line-strong); border-radius:3px; display:grid; place-items:center; color:#08191a; font-size:11px; }
    .selected .check-box { background:var(--accent); border-color:var(--accent); }
    .selected .check-box::after { content:"✓"; font-weight:800; }

    .stagebar { display:flex; align-items:center; gap:0; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
    .stage-step { min-width:112px; display:flex; align-items:center; color:var(--faint); font-size:12px; }
    .stage-step::after { content:""; height:1px; flex:1; min-width:18px; background:var(--line-strong); margin:0 6px; }
    .stage-step:last-child::after { display:none; }
    .stage-step.done { color:var(--success); }
    .stage-step.active { color:var(--text); font-weight:700; }
    .stage-step.active .step-dot { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
    .step-dot { width:9px; height:9px; border-radius:50%; border:2px solid currentColor; margin-right:6px; flex:0 0 auto; }

    .kanban { display:grid; grid-template-columns:repeat(6,minmax(210px,1fr)); gap:10px; overflow-x:auto; padding-bottom:10px; }
    .column { background:#1c1f24; border:1px solid var(--line); border-radius:var(--radius-md); min-height:420px; }
    .column-head { display:flex; align-items:center; gap:8px; padding:10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#1c1f24; border-radius:var(--radius-md) var(--radius-md) 0 0; }
    .task-card { margin:8px; padding:10px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); cursor:pointer; }
    .task-card:hover { border-color:var(--line-strong); }
    .task-card .title { font-weight:650; margin-bottom:7px; }
    .task-card .foot { display:flex; justify-content:space-between; color:var(--faint); font-size:11px; margin-top:9px; }
    .task-card.blocked { border-color:rgba(220,113,113,.5); }

    .asset-row { display:grid; grid-template-columns:minmax(130px,.55fr) minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
    .asset-row:last-child { border:0; }
    .asset-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .asset-type { color:var(--muted); font-size:12px; }

    .editor { min-height:520px; background:#1b1e23; border:1px solid var(--line); border-radius:var(--radius-sm); padding:18px 20px; }
    .editor h2 { font-size:21px; margin:0 0 16px; }
    .editor h3 { font-size:16px; margin:20px 0 8px; }
    .editor p { margin:0 0 12px; color:#d8dce1; }
    .editor .source-anchor { border-bottom:1px dashed var(--accent); color:var(--accent-strong); }
    .editor-toolbar { display:flex; align-items:center; gap:6px; padding:7px; border:1px solid var(--line); border-bottom:0; background:var(--surface-2); border-radius:var(--radius-sm) var(--radius-sm) 0 0; }
    .editor-toolbar + .editor { border-radius:0 0 var(--radius-sm) var(--radius-sm); }
    .tool { border:0; background:transparent; color:var(--muted); min-width:28px; height:28px; border-radius:3px; cursor:pointer; }
    .tool:hover { color:var(--text); background:var(--surface-3); }

    .dual-tabs { display:none; }
    .dual-editor { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .platform-head { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
    .platform-head h2 { margin:0; font-size:16px; }
    .platform-head .spacer { flex:1; }

    .candidate { border:1px solid var(--line); border-radius:var(--radius-md); padding:13px; cursor:pointer; background:var(--surface); position:relative; }
    .candidate:hover { border-color:var(--line-strong); }
    .candidate.selected { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:var(--accent-soft); }
    .candidate .rank { color:var(--faint); font:700 11px var(--font-data); }
    .candidate h3 { font-size:16px; margin:8px 0 7px; }
    .candidate p { color:var(--muted); margin:0 0 11px; font-size:13px; }
    .evidence { padding:8px 9px; background:#181b1f; border-radius:var(--radius-sm); color:#c2c8ce; font-size:12px; }
    .candidate.selected::after { content:"已选择"; position:absolute; top:10px; right:10px; color:var(--accent-strong); font:700 10px var(--font-data); }

    .checklist { display:grid; gap:8px; }
    .check-item { display:grid; grid-template-columns:22px minmax(0,1fr) auto; align-items:start; gap:9px; padding:9px; border:1px solid var(--line); border-radius:var(--radius-sm); }
    .check-item.checked { border-color:rgba(103,185,135,.42); background:var(--success-soft); }
    .check-icon { width:18px; height:18px; border:1px solid var(--line-strong); border-radius:3px; display:grid; place-items:center; color:#0c1d12; }
    .checked .check-icon { background:var(--success); border-color:var(--success); }
    .checked .check-icon::after { content:"✓"; font-weight:800; }
    .check-desc { color:var(--muted); font-size:12px; margin-top:2px; }

    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .field { display:grid; gap:5px; }
    .field.full { grid-column:1/-1; }
    .field label { color:var(--muted); font-size:12px; }
    textarea { min-height:96px; resize:vertical; }
    .help { color:var(--faint); font-size:11px; }

    .platform-card { border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; }
    .platform-card > header { display:flex; align-items:center; gap:8px; padding:11px 13px; background:var(--surface-2); border-bottom:1px solid var(--line); }
    .platform-card > .body { padding:13px; }

    .recovery-ledger { font-family:var(--font-data); font-size:12px; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
    .ledger-row { display:grid; grid-template-columns:92px minmax(180px,1fr) 90px 90px 100px; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); align-items:center; }
    .ledger-row:last-child { border:0; }
    .ledger-head { color:var(--faint); background:#181b1f; font-size:10px; text-transform:uppercase; }
    .hash { overflow:hidden; text-overflow:ellipsis; color:var(--muted); }

    .notice { display:none; align-items:flex-start; gap:10px; margin-bottom:14px; border:1px solid var(--line-strong); border-radius:var(--radius-md); padding:11px 12px; }
    .notice.visible { display:flex; }
    .notice.info { background:var(--info-soft); border-color:rgba(118,167,232,.42); }
    .notice.warn { background:var(--human-soft); border-color:rgba(215,168,79,.46); }
    .notice.error { background:var(--danger-soft); border-color:rgba(220,113,113,.46); }
    .notice.success { background:var(--success-soft); border-color:rgba(103,185,135,.46); }
    .notice-mark { flex:0 0 auto; width:22px; height:22px; display:grid; place-items:center; border:1px solid currentColor; border-radius:50%; font:700 11px var(--font-data); }
    .notice-title { font-weight:700; }
    .notice-copy { color:#c9cfd5; font-size:12px; margin-top:2px; }
    .notice-actions { margin-left:auto; display:flex; gap:7px; }

    .state-stage { position:relative; }
    .state-replacement { display:none; min-height:500px; place-items:center; border:1px dashed var(--line-strong); border-radius:var(--radius-md); background:rgba(0,0,0,.08); text-align:center; padding:40px; }
    .state-replacement.visible { display:grid; }
    .state-replacement h2 { margin:12px 0 5px; font-size:18px; }
    .state-replacement p { color:var(--muted); max-width:520px; margin:0 auto 15px; }
    .state-symbol { width:46px; height:46px; border:1px solid var(--line-strong); border-radius:50%; display:grid; place-items:center; color:var(--muted); font:700 15px var(--font-data); margin:auto; }
    .spinner { width:28px; height:28px; border:3px solid var(--line-strong); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .progress { height:5px; background:#15171a; border-radius:4px; overflow:hidden; margin:14px auto 8px; max-width:380px; }
    .progress > i { display:block; width:62%; height:100%; background:var(--accent); animation:pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
    .skeleton { width:min(640px,100%); display:grid; gap:10px; }
    .sk { height:14px; border-radius:3px; background:linear-gradient(90deg,#252a31,#313740,#252a31); background-size:200% 100%; animation:shimmer 1.2s linear infinite; }
    .sk.short { width:42%; }
    .sk.med { width:72%; }
    .sk.block { height:96px; }
    @keyframes shimmer { to { background-position:-200% 0; } }

    .confirm-sheet { display:none; position:fixed; inset:0; background:rgba(7,8,10,.72); z-index:70; align-items:center; justify-content:center; padding:20px; }
    .confirm-sheet.visible { display:flex; }
    .confirm-card { width:min(620px,100%); background:var(--surface); border:1px solid rgba(215,168,79,.55); border-radius:var(--radius-lg); box-shadow:var(--shadow); }
    .confirm-head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:9px; }
    .confirm-body { padding:16px; }
    .confirm-body h2 { margin:0 0 7px; font-size:18px; }
    .confirm-body p { color:var(--muted); }
    .confirm-actions { display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }

    .toast { position:fixed; right:20px; bottom:20px; width:min(390px,calc(100vw - 40px)); background:#242a30; border:1px solid rgba(103,185,135,.55); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:12px 13px; display:none; z-index:80; }
    .toast.visible { display:block; animation:toast-in .18s ease-out; }
    @keyframes toast-in { from { opacity:0; transform:translateY(8px); } }

    .flowbar { position:fixed; left:252px; right:16px; bottom:14px; background:#24292f; border:1px solid var(--line-strong); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:10px 12px; z-index:50; display:none; align-items:center; gap:11px; }
    .flowbar.visible { display:flex; }
    .flow-name { min-width:180px; }
    .flow-name b { display:block; font-size:12px; }
    .flow-name span { color:var(--muted); font-size:11px; }
    .flow-steps { flex:1; display:flex; gap:5px; overflow:hidden; }
    .flow-pill { height:5px; background:var(--line-strong); flex:1; min-width:16px; border-radius:4px; }
    .flow-pill.done { background:var(--success); }
    .flow-pill.active { background:var(--human); }
    .flow-action { max-width:360px; color:#d5d9de; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .flow-menu { position:fixed; top:52px; right:18px; width:min(460px,calc(100vw - 36px)); background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-md); box-shadow:var(--shadow); padding:8px; z-index:60; display:none; }
    .flow-menu.visible { display:grid; gap:6px; }
    .flow-option { display:grid; grid-template-columns:28px minmax(0,1fr); gap:9px; text-align:left; padding:10px; border:1px solid transparent; background:transparent; border-radius:var(--radius-sm); cursor:pointer; }
    .flow-option:hover { border-color:var(--line); background:var(--surface-2); }
    .flow-no { color:var(--accent-strong); font:700 12px var(--font-data); }
    .flow-option b { display:block; }
    .flow-option span { color:var(--muted); font-size:12px; }

    .screen-caption { color:var(--faint); font-size:11px; margin-top:12px; }
    .empty-illustration { width:54px; height:54px; margin:auto; border:1px solid var(--line-strong); display:grid; place-items:center; border-radius:12px; font:700 12px var(--font-data); color:var(--muted); transform:rotate(-2deg); }

    @media (max-width: 1100px) {
      .app-shell { grid-template-columns: 190px minmax(0,1fr); }

      library:{name:'库内素材常规闭环',steps:[
        ['topics','normal','从库内未用材料生成常规候选'],['task','normal','创建任务并核对来源关联'],['brief','confirm','人工批准 Brief'],['viral','confirm','人工选择爆款设计'],['editor','normal','生成并修改双平台稿'],['review','confirm','双平台分别核验'],['publish','partial','先登记一个平台的真实发布事实'],['retrospective','normal','录入真实数据并生成结构化复盘']
      ]},
      recovery:{name:'中断与冲突恢复',steps:[
        ['brief','ai_generating','AI 已返回，正在准备待写入版本'],['recovery','external_change','检测到公众号稿出现第三种哈希'],['recovery','confirm','比较三方差异，人工选择恢复策略'],['recovery','success','恢复动作验证完成，任务未重复写入'],['editor','normal','回到双栏创作，继续未完成稿件']
      ]}
    };

    let activePage = 'today';
    let activeFlow = null;
    let flowIndex = 0;

    function healthItem(title, desc, state){ return `<div class="check-item ${state==='ok'?'checked':''}"><span class="check-icon"></span><div><div class="strong">${title}</div><div class="check-desc">${desc}</div></div><span class="badge ${state==='ok'?'success':'human'}">${state==='ok'?'通过':'待处理'}</span></div>`; }
    function metric(label,value,note){ return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}<span class="metric-note">${note}</span></div></div>`; }
    function todayRow(type,title,meta,action,page){ return `<div class="list-row"><span class="badge neutral">${type}</span><div><div class="list-title">${title}</div><div class="list-meta">${meta}</div></div><button class="btn small" data-page="${page}">${action}</button></div>`; }
    function asset(label,value,type){ return `<div class="asset-row"><span class="asset-type">${label}</span><span class="asset-name">${value}</span><span class="badge ${type}">${type==='success'?'已完成':'待人工'}</span></div>`; }
    function assetRow(type,name,status){ return `<div class="asset-row"><span class="asset-type">${type}</span><span class="asset-name">${name}</span><span class="badge ${status==='已通过'||status==='已定位'?'success':'human'}">${status}</span></div>`; }
    function kv(label,value){ return `<div class="row" style="align-items:flex-start;padding:6px 0"><span class="muted" style="min-width:92px">${label}</span><span class="spacer">${value}</span></div>`; }
    function platformStatus(name,status,label){ return `<div class="asset-row"><span class="asset-type">${name}</span><span class="mono">${status}</span><span class="badge human">${label}</span></div>`; }
    function column(name,count,cards){ return `<div class="column"><div class="column-head"><strong>${name}</strong><span class="nav-count">${count}</span></div>${cards.join('')}</div>`; }
    function card(title,state,time,blocked=false){ return `<div class="task-card ${blocked?'blocked':''}" data-page="task"><div class="title">${title}</div><span class="badge ${blocked?'danger':state.includes('人工')||state.includes('审核')||state.includes('选择')?'human':'neutral'}">${state}</span><div class="foot"><span>${time}</span><span>打开 →</span></div></div>`; }
    function inboxRow(title,meta,selected,domain){ return `<div class="list-row selectable ${selected?'selected':''}" role="option" tabindex="0" aria-selected="${selected}"><span class="check-box"></span><div><div class="list-title">${title}</div><div class="list-meta">${meta}</div></div><span class="badge neutral">${domain}</span></div>`; }
    function candidate(rank,title,pattern,promise,evidenceText,selected){ return `<article class="candidate ${selected?'selected':''}" role="radio" tabindex="0" aria-checked="${selected}"><span class="rank">候选 ${rank}</span><h3>${title}</h3><p>${pattern} · ${promise}</p><div class="evidence"><span class="muted">证据锚点：</span>${evidenceText}</div></article>`; }
    function viralPlan(letter,type,hook,benefit,risk,selected){ return `<article class="candidate ${selected?'selected':''}"><span class="rank">方案 ${letter} · ${type}</span><h3>${hook}</h3><div class="rule"></div>${kv('优势',benefit)}${kv('风险',risk)}<button class="btn small ${selected?'primary':''}" style="margin-top:10px">${selected?'当前选择':'查看详情'}</button></article>`; }
    function check(title,checked,note=''){ return `<div class="check-item ${checked?'checked':''}"><span class="check-icon"></span><div><div class="strong">${title}</div>${note?`<div class="check-desc">${note}</div>`:''}</div><span class="badge ${checked?'success':'human'}">${checked?'完成':'待人工'}</span></div>`; }
    function reviewBlock(label,text){ return `<div><div class="badge neutral">${label}</div><div style="margin-top:6px;color:#d6dbe0">${text}</div></div>`; }
    function stagebar(active){ const names=['选题','Brief','爆款设计','双稿创作','人工核验','发布','复盘']; return `<div class="stagebar">${names.map((n,i)=>`<div class="stage-step ${i<active?'done':i===active?'active':''}"><span class="step-dot"></span>${n}</div>`).join('')}</div>`; }

    function renderSidebar(){
      document.getElementById('sidebar').innerHTML = groups.map(g=>`<div class="nav-group"><div class="nav-title">${g.title}</div>${g.items.map(([id,label,key])=>`<button class="nav-item ${id===activePage?'active':''}" data-page="${id}"><span>${label}</span><span class="nav-key">${key}</span></button>`).join('')}</div>`).join('') + `<div class="sidebar-note">MVP 功能原型 v1<br>所有按钮仅演示产品行为，不会写入 Vault 或调用 AI。</div>`;
    }

    function renderPage(pageId, keepState=false){
      activePage = pageId;
      const page = pages[pageId];
      renderSidebar();
      document.getElementById('breadcrumb').textContent = `内容生产驾驶舱 / ${page.group}`;
      document.getElementById('pageTitle').textContent = page.title;
      document.getElementById('pageSubtitle').textContent = page.subtitle;
      document.getElementById('pageActions').innerHTML = page.actions.map(([label,type])=>`<button class="btn ${type}">${label}</button>`).join('');
      document.getElementById('pageContent').innerHTML = page.html();
      document.getElementById('main').focus({preventScroll:true});
      if(!keepState) document.getElementById('stateSelect').value='normal';
      applyState(document.getElementById('stateSelect').value);
    }

    function applyState(state){
      const def = stateDefs[state];
      const notice = document.getElementById('stateNotice');
      const replacement = document.getElementById('stateReplacement');
      const content = document.getElementById('pageContent');
      notice.className='notice'; notice.innerHTML='';
      replacement.className='state-replacement'; replacement.innerHTML='';
      content.style.display='';
      document.getElementById('confirmSheet').classList.remove('visible');
      if(state==='normal') return;
      if(def.replace){
        content.style.display='none'; replacement.classList.add('visible');
        if(def.replace==='loading') replacement.innerHTML=`<div class="skeleton"><div class="sk short"></div><div class="sk med"></div><div class="sk block"></div><div class="sk"></div><div class="sk med"></div></div>`;
        if(def.replace==='empty') replacement.innerHTML=`<div><div class="empty-illustration">EMPTY</div><h2>${pages[activePage].title}还没有内容</h2><p>${emptyCopy(activePage)}</p><button class="btn primary">${emptyAction(activePage)}</button></div>`;
        if(def.replace==='ai') replacement.innerHTML=`<div><div class="spinner"></div><h2>${pageVerbs[activePage]}中</h2><p>正在读取当前任务允许的素材、模板与规则。正式文件尚未改变，你可以安全取消。</p><div class="progress"><i></i></div><div class="mono muted">步骤 3 / 5 · 生成预览</div><button class="btn ghost" style="margin-top:16px">取消并保留当前文件</button></div>`;
        return;
      }
      if(def.confirm){ openConfirm('generic'); return; }
      notice.classList.add('visible',def.kind);
      notice.innerHTML=`<span class="notice-mark">${def.kind==='error'?'!':def.kind==='success'?'✓':def.kind==='warn'?'!':'i'}</span><div><div class="notice-title">${def.title}</div><div class="notice-copy">${def.copy}</div></div><div class="notice-actions">${stateActionButtons(state)}</div>`;
      if(state==='success') showToast('成功｜写入后已重新读取验证，任务状态可继续推进。');
    }

    function stateActionButtons(state){
      const map={ai_failed:['查看错误','重试'],missing_file:['解除关联','重新定位'],external_change:['打开差异','进入恢复'],review_invalid:['查看修改','重新核验'],key_error:['打开设置','验证密钥'],partial:['查看未完成项','继续处理'],first_use:['了解本页','开始']};
      const a=map[state]; if(!a) return '';
      return `<button class="btn small ghost">${a[0]}</button><button class="btn small ${state==='review_invalid'?'human':'primary'}">${a[1]}</button>`;
    }
    function emptyCopy(page){ const map={inbox:'请先把新素材放入 Inbox。系统不会擅自改用库内旧素材。',pipeline:'还没有内容任务。可以从库内素材或 Inbox 新素材创建第一条任务。',today:'今天没有等待处理的任务。你可以查看 Inbox，或从库内未用材料开始常规选题。',publish:'还没有进入 ready 的平台稿件。先完成各平台的人工核验。',retrospective:'还没有到达复盘时间的已发布内容。'}; return map[page]||'此页面暂时没有可显示的数据。系统会说明产生第一条数据的最短路径。'; }
    function emptyAction(page){ const map={inbox:'打开 Inbox 目录',pipeline:'从素材创建任务',today:'查看新素材',publish:'查看待核验稿件',retrospective:'查看已发布内容'}; return map[page]||'开始第一步'; }

    function openConfirm(kind){
      const copy={
        generic:['确认执行当前人工动作？','系统会记录你的确认、当前资产哈希、时间与检查清单版本。','状态只在写入并验证成功后推进；AI 不会代签。'],
        mapping:['确认试点资产映射？','请确认这些来源、Brief、设计稿和双平台稿确实属于同一选题。','只会为 3 条试点建立链接与任务卡，不移动或改名原文件。'],
        topic:['确认这个选题进入正式生产？','候选 01 将成为正式内容任务。确认前仍只是 AI 建议。','创建任务卡并关联 2 份新素材，进入 Brief 阶段。'],
        brief:['确认 Brief 已核验通过？','请确认统计口径、核心观点、证据与事实边界都准确。','审核记录绑定当前 Brief 哈希；后续实质修改会使审核失效。'],
        viral:['确认采用方案 B？','这会锁定本轮 Hook、标题、情绪曲线与双平台差异。','任务进入双稿创作；其他方案保留为备选，不删除。'],
        videoReview:['确认视频号稿已逐句核验？','AI 检查不能替代你的朗读、事实与合规确认。','视频号状态进入 ready；公众号状态保持不变。'],
        publishVideo:['确认视频号已经实际发布？','请只在平台发布成功且日期、链接真实时确认。','视频号进入 published；任务仍等待公众号独立完成或跳过。'],
        retrospective:['确认复盘内容与数据？','缺失数据必须保持“未采集”，推断不能伪装成事实。','保存复盘，检查素材归档与轻量提取门槛。'],
        recovery:['选择恢复策略前先看差异','当前外部版本不能被系统自动覆盖。','你的选择会生成新的恢复操作；原始快照与冲突记录继续保留。']
      }[kind] || null;
      document.getElementById('confirmTitle').textContent=copy[0];
      document.getElementById('confirmCopy').textContent=copy[1];
      document.getElementById('confirmImpact').textContent=copy[2];
      document.getElementById('confirmSheet').classList.add('visible');
      document.getElementById('confirmCancel').focus();
    }

    function showToast(text){ const t=document.getElementById('toast'); t.innerHTML=`<div class="row"><span class="badge success">已完成</span><strong>${text}</strong></div>`; t.classList.add('visible'); setTimeout(()=>t.classList.remove('visible'),3200); }

    function handleHeaderAction(label){
      if(label.includes('快速选题')) { document.getElementById('stateSelect').value='ai_generating'; renderPage('topics',true); return; }
      if(label.includes('确认所选角度')) { openConfirm('topic'); return; }
      if(label.includes('确认方案')) { openConfirm('viral'); return; }
      if(label.includes('AI') || label.includes('生成')) { document.getElementById('stateSelect').value='ai_generating'; applyState('ai_generating'); return; }
      if(label.includes('保存发布')) { openConfirm('publishVideo'); return; }
      if(label.includes('保存设置')) { document.getElementById('stateSelect').value='success'; applyState('success'); return; }
      if(label.includes('开始安全配置')) { renderPage('onboarding'); return; }
      showToast(`${label}｜原型已记录这个操作入口。`);
    }

    function toggleChoice(el){
      if(el.classList.contains('candidate')){
        document.querySelectorAll('.candidate').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-checked','false');});
        el.classList.add('selected'); el.setAttribute('aria-checked','true');
      } else {
        el.classList.toggle('selected'); el.setAttribute('aria-selected',String(el.classList.contains('selected')));
      }
    }

    function startFlow(id){ activeFlow=id; flowIndex=0; document.getElementById('flowMenu').classList.remove('visible'); document.getElementById('flowbar').classList.add('visible'); renderFlowStep(); }
    function renderFlowStep(){
      const flow=flows[activeFlow], step=flow.steps[flowIndex];
      document.getElementById('stateSelect').value=step[1];
      renderPage(step[0],true);
      document.getElementById('flowName').textContent=flow.name;
      document.getElementById('flowIndex').textContent=`第 ${flowIndex+1} / ${flow.steps.length} 步`;
      document.getElementById('flowAction').textContent=step[2];
      document.getElementById('flowSteps').innerHTML=flow.steps.map((_,i)=>`<span class="flow-pill ${i<flowIndex?'done':i===flowIndex?'active':''}"></span>`).join('');
      document.getElementById('flowPrev').disabled=flowIndex===0;
      document.getElementById('flowNext').textContent=flowIndex===flow.steps.length-1?'完成演示':'下一步';
    }
    function closeFlow(){ activeFlow=null; document.getElementById('flowbar').classList.remove('visible'); document.getElementById('stateSelect').value='normal'; applyState('normal'); }

    document.addEventListener('click', e=>{
      const page=e.target.closest('[data-page]'); if(page){ renderPage(page.dataset.page); return; }
      const ai=e.target.closest('[data-ai]'); if(ai){ document.getElementById('stateSelect').value='ai_generating'; applyState('ai_generating'); return; }
      const confirm=e.target.closest('[data-confirm]'); if(confirm){ openConfirm(confirm.dataset.confirm); return; }
      const dual=e.target.closest('[data-dual]'); if(dual){ const host=document.querySelector('.dual-editor'); if(host) host.dataset.active=dual.dataset.dual; document.querySelectorAll('[data-dual]').forEach(x=>x.classList.toggle('primary',x===dual)); return; }
      const headerAction=e.target.closest('#pageActions .btn'); if(headerAction){ handleHeaderAction(headerAction.textContent.trim()); return; }
      const selectable=e.target.closest('.list-row.selectable'); if(selectable){ toggleChoice(selectable); return; }
      const candidateEl=e.target.closest('.candidate'); if(candidateEl){ toggleChoice(candidateEl); return; }
    });
    document.getElementById('stateSelect').addEventListener('change',e=>applyState(e.target.value));
    document.getElementById('flowMenuButton').addEventListener('click',()=>{ const m=document.getElementById('flowMenu'); m.classList.toggle('visible'); document.getElementById('flowMenuButton').setAttribute('aria-expanded',m.classList.contains('visible')); });
    document.querySelectorAll('[data-flow]').forEach(b=>b.addEventListener('click',()=>startFlow(b.dataset.flow)));
    document.getElementById('flowPrev').addEventListener('click',()=>{ if(flowIndex>0){flowIndex--;renderFlowStep();} });
    document.getElementById('flowNext').addEventListener('click',()=>{ const flow=flows[activeFlow]; if(flowIndex<flow.steps.length-1){flowIndex++;renderFlowStep();}else{showToast('三条链中的当前演示已走通。');closeFlow();} });
    document.getElementById('flowClose').addEventListener('click',closeFlow);
    document.getElementById('confirmCancel').addEventListener('click',()=>{document.getElementById('confirmSheet').classList.remove('visible');document.getElementById('stateSelect').value='normal';});
    document.getElementById('confirmAccept').addEventListener('click',()=>{document.getElementById('confirmSheet').classList.remove('visible');document.getElementById('stateSelect').value='success';applyState('success');});
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ document.getElementById('confirmSheet').classList.remove('visible'); document.getElementById('flowMenu').classList.remove('visible'); }
      if((e.key==='Enter'||e.key===' ') && (e.target.matches('.candidate')||e.target.matches('.list-row.selectable'))){ e.preventDefault(); toggleChoice(e.target); }
    });

    const initial = new URLSearchParams(location.search);
    const initialPage = pages[initial.get('page')] ? initial.get('page') : 'today';
    const initialState = stateDefs[initial.get('state')] ? initial.get('state') : 'normal';
    document.getElementById('stateSelect').value = initialState;
    renderPage(initialPage, true);
  </script>
</body>
</html>
